name: Build Mac

# Packages the Mac app (SwipeScout.dmg, Apple Silicon) from prebuilt app files and attaches it to release v<version>.
# The app files (compiled jars, no source code) are pushed to a temporary branch; it is deleted afterwards.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 4.1"
        required: true
      payload:
        description: "Temporary branch with the app files"
        required: true
        default: mac-payload

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          path: public
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.payload }}
          path: payload
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build app (jpackage)
        env:
          V: ${{ inputs.version }}
        run: |
          jpackage --type app-image --dest out \
            --input payload/jars --main-jar desktop.jar --main-class app.swipescout.desktop.MainKt \
            --name "Swipe Scout" --app-version "$V.0" --vendor "Swipe Scout" --description "Swipe Scout" \
            --icon payload/icon.icns --mac-package-identifier io.github.hyperflux22.swipescout \
            --add-modules java.desktop,java.instrument,java.management,java.prefs,java.xml,jdk.unsupported,jdk.crypto.ec,jdk.localedata,jdk.charsets \
            --jlink-options "--strip-debug --no-header-files --no-man-pages --strip-native-commands" \
            --java-options "-Xmx2g" --java-options "-Dcompose.application.configure.swing.globals=true" \
            --java-options "-Djpackage.app-version=$V.0"
          ls out
      - name: Sign (ad hoc) and package DMG
        run: |
          APP="out/Swipe Scout.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Swipe Scout" -srcfolder dmg -ov -format UDZO SwipeScout.dmg
          ls -la SwipeScout.dmg
      - name: Smoke test (app starts)
        run: |
          "out/Swipe Scout.app/Contents/MacOS/Swipe Scout" > run.log 2>&1 &
          sleep 25
          if kill -0 $! 2>/dev/null; then echo "app is running"; kill $!; else echo "app exited"; cat run.log; exit 1; fi
          cat run.log
      - uses: actions/upload-artifact@v4
        with:
          name: SwipeScout-mac
          path: SwipeScout.dmg
      - name: Attach to release, add to versions folder, delete temporary branch
        working-directory: public
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
        run: |
          gh release upload "v$V" ../SwipeScout.dmg --clobber
          mkdir -p "versions/$V" && cp ../SwipeScout.dmg "versions/$V/SwipeScout.dmg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "versions/$V/SwipeScout.dmg"
          git commit -m "Mac app for version $V" && git push
          git push origin --delete "${{ inputs.payload }}"
